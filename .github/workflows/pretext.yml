# Builds the PreTeXt project on every pull request.
# On pushes to main, also deploys the HTML (with the PDF alongside) to GitHub Pages.
#
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".

name: PreTeXt build and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Image maintained by the PreTeXt CLI team; includes TeX and the asset tools
    # needed for PDF builds and generated images.
    container: oscarlevin/pretext-full
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned PreTeXt CLI
        run: |
          python3 -m pip install -r requirements.txt \
            || python3 -m pip install --break-system-packages -r requirements.txt
          pretext --version

      # Fails on RELAX-NG schema errors only. `pretext validate` also reports
      # "validation-plus" style notes (Unicode dashes, issue #7) and exits 1 for
      # them, so its exit code alone is not used. In the terse report each line
      # is one tab-separated message whose 4th field names the check; schema
      # messages are "schema", and a jing line core could not locate has fewer
      # fields (unlocated style notes start with "PTX:"). Validation that could
      # not run (exit 2, or jing itself failing) also fails the step.
      # The container image predates jing in the PreTeXt images, so install it
      # when missing.
      - name: Validate source against the PreTeXt schema
        shell: bash
        run: |
          if ! command -v jing >/dev/null; then
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends jing
          fi
          status=0
          pretext validate web --report-form terse > validate.log 2>&1 || status=$?
          cat validate.log
          report=logs/main-validation.txt
          if [ "$status" -gt 1 ] || [ ! -f "$report" ] || grep -q 'the "jing" program failed' validate.log; then
            echo "::error::Schema validation could not run (exit code $status)."
            exit 1
          fi
          schema_errors="$(awk -F'\t' 'NF && $1 !~ /^PTX:/ && (NF < 5 || $4 == "schema")' "$report")"
          if [ -n "$schema_errors" ]; then
            echo "::error::The source does not match the PreTeXt schema:"
            printf '%s\n' "$schema_errors"
            exit 1
          fi
          echo "No schema errors. Style notes (not fatal): $(grep -c . "$report" || true)."

      - name: Build HTML
        run: pretext build web

      - name: Build PDF
        run: pretext build print

      - name: Place PDF in the site
        run: |
          pdf="$(find output/print -maxdepth 1 -name '*.pdf' | head -n 1)"
          if [ -n "$pdf" ]; then cp "$pdf" output/web/book.pdf; fi

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: output/web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
