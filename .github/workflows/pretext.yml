# Builds the PreTeXt project on every pull request.
# On pushes to main, also deploys the HTML (with the PDF alongside) to GitHub Pages.
#
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".

name: PreTeXt build and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the running check, so cancel it.
# Runs on main deploy to Pages and are never cancelled mid-run; they queue.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Image maintained by the PreTeXt CLI team; includes TeX and the asset tools
    # needed for PDF builds and generated images.
    container: oscarlevin/pretext-full
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned PreTeXt CLI
        run: |
          python3 -m pip install -r requirements.txt \
            || python3 -m pip install --break-system-packages -r requirements.txt
          pretext --version

      # The source validates with zero messages, so any message is fatal:
      # RELAX-NG schema errors and "validation-plus" notes (Unicode dashes,
      # issue #7, and everything else) alike. `pretext validate` exits 1 when it
      # reports any message, and the consolidated report lists one message per
      # line. Validation that could not run (exit 2 or higher, no report, or
      # jing itself failing) also fails the step.
      # The container image predates jing in the PreTeXt images, so install it
      # when missing.
      - name: Validate source against the PreTeXt schema
        shell: bash
        run: |
          if ! command -v jing >/dev/null; then
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends jing
          fi
          status=0
          pretext validate web --report-form terse > validate.log 2>&1 || status=$?
          cat validate.log
          report=logs/main-validation.txt
          if [ "$status" -gt 1 ] || [ ! -f "$report" ] || grep -q 'the "jing" program failed' validate.log; then
            echo "::error::Validation could not run (exit code $status)."
            exit 1
          fi
          count="$(grep -c . "$report" || true)"
          if [ "$status" -ne 0 ] || [ "$count" -ne 0 ]; then
            echo "::error::Validation reported $count message(s) (exit code $status); any message fails the build:"
            cat "$report"
            exit 1
          fi
          echo "Validation passed with no messages."

      - name: Build HTML
        run: pretext build web

      - name: Build PDF
        run: pretext build print

      - name: Place PDF in the site
        run: |
          # The preface links book.pdf, so a missing PDF is a broken site.
          pdf="$(find output/print -maxdepth 1 -name '*.pdf' | head -n 1)"
          if [ -z "$pdf" ]; then
            echo "::error::No PDF found in output/print; the site links book.pdf, so the build fails."
            exit 1
          fi
          cp "$pdf" output/web/book.pdf

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: output/web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
